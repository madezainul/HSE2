# Test profile: everything runs in memory. Tests must never connect to MySQL.
# The profile is called "h2test" on purpose: src/main/resources already contains an
# application-test.properties that points at a MySQL database.
#
# Use it with @ActiveProfiles("h2test"). Kept as .yml because *.properties files are git-ignored.
spring:
  datasource:
    url: jdbc:h2:mem:hse_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 2525
  thymeleaf:
    cache: false
  devtools:
    restart:
      enabled: false

app:
  # Tests that store files write here, never into the real uploads folder
  upload-dir: ${java.io.tmpdir}/hse-test-uploads
