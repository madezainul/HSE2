<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>HSE Induction Detail</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

	<!-- Fonts and icons -->
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () {
				sessionStorage.fonts = true;
			}
		});
	</script>

	<!-- CSS Files -->
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">

	<!-- Custom Styles -->
	<link rel="stylesheet" href="/css/custom-cards.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<a href="/training/hse-induction" class="btn btn-secondary btn-sm mb-3">
						<i class="fa fa-arrow-left me-2"></i> Back to List
					</a>
					<h2 class="fw-bold mb-2 text-dark" th:text="'HSE Induction: ' + ${induction.code}">HSE Induction Detail</h2>
					<p class="text-muted mb-0">
						<i class="fa fa-calendar-alt me-2"></i>
						<span th:text="${induction.inductionDate != null ? #temporals.format(induction.inductionDate, 'dd MMMM, yyyy') : 'N/A'}"></span>
					</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-warning btn-round me-2" id="editInductionBtn"
						th:data-induction-code="${induction.code}">
						<i class="fa fa-edit me-2"></i> Edit
					</button>
					<button type="button" class="btn btn-danger btn-round" id="deleteInductionBtn"
						sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" th:data-induction-code="${induction.code}"
						onclick="deleteInduction(event)">
						<i class="fa fa-trash me-2"></i> Delete
					</button>
				</div>
			</div>

			<div class="row">
				<!-- Main Details Column -->
				<div class="col-md-8">
					<!-- Induction Information Card -->
					<div class="card mb-4 shadow-sm border-0">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Induction Information</div>
						</div>
						<div class="card-body">
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Induction Code</label>
										<p class="text-muted" th:text="${induction.code}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Induction Name</label>
										<p class="text-muted" th:text="${induction.inductionName}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Category</label>
										<p class="text-muted" th:text="${induction.category}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Value</label>
										<p class="text-muted" th:text="${induction.value ?: 'N/A'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Induction Date</label>
										<p class="text-muted"
											th:text="${induction.inductionDate != null ? #temporals.format(induction.inductionDate, 'dd MMMM, yyyy') : 'N/A'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Created By</label>
										<p class="text-muted" th:text="${induction.createdBy != null ? induction.createdBy.username : 'Unknown'}"></p>
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-md-12">
									<div class="form-group">
										<label class="form-label fw-bold">Description</label>
										<p class="text-muted" th:text="${induction.description ?: 'No description provided.'}"></p>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Sidebar Column -->
				<div class="col-md-4">
					<!-- Summary Card -->
					<div class="card mb-4 shadow-sm border-0">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Summary</div>
						</div>
						<div class="card-body">
							<div class="row mb-3">
								<div class="col-6">
									<p class="text-muted small mb-1">Category</p>
									<p class="fw-bold mb-0" th:text="${induction.category}"></p>
								</div>
								<div class="col-6">
									<p class="text-muted small mb-1">Induction Date</p>
									<p class="fw-bold mb-0"
										th:text="${induction.inductionDate != null ? #temporals.format(induction.inductionDate, 'dd/MM/yyyy') : 'N/A'}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-6">
									<p class="text-muted small mb-1">Value</p>
									<p class="fw-bold mb-0" th:text="${induction.value ?: 'N/A'}"></p>
								</div>
								<div class="col-6">
									<p class="text-muted small mb-1">Total Files</p>
									<p class="fw-bold mb-0" th:text="${files.size()}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-6">
									<p class="text-muted small mb-1">Created</p>
									<p class="fw-bold mb-0"
										th:text="${induction.createdAt != null ? #temporals.format(induction.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></p>
								</div>
								<div class="col-6">
									<p class="text-muted small mb-1">Last Updated</p>
									<p class="fw-bold mb-0"
										th:text="${induction.updatedAt != null ? #temporals.format(induction.updatedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></p>
								</div>
							</div>
						</div>
					</div>

					<!-- Creator Info Card -->
					<div class="card mb-4 shadow-sm border-0" th:if="${induction.createdBy != null}">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Created By</div>
						</div>
						<div class="card-body">
							<div class="d-flex align-items-center">
								<div class="avatar">
									<img th:src="${induction.createdBy.profilePicture != null ? '/file/' + induction.createdBy.profilePicture : '/assets/img/profile2.jpg'}"
										alt="Creator" class="avatar-img rounded-circle">
								</div>
								<div class="ms-3">
									<p class="fw-bold mb-1" th:text="${induction.createdBy.username}"></p>
									<small class="text-muted" th:text="${induction.createdBy.email ?: 'No email'}"></small>
								</div>
							</div>
						</div>
					</div>

					<!-- Document Attachments -->
					<div class="card shadow-sm border-0 mb-4" th:if="${!documents.isEmpty()}">
						<div class="card-header bg-gradient bg-secondary text-white border-0">
							<div class="card-title text-white mb-0">
								<i class="fa fa-paperclip me-2"></i> Documents
							</div>
						</div>
						<div class="card-body p-3">
							<ul class="list-group list-group-flush">
								<li class="list-group-item d-flex align-items-center justify-content-between px-0" th:each="file : ${documents}">
									<div>
										<i class="fa fa-file-alt me-2" style="color: #6c757d;"></i>
										<span th:text="${file.fileName}"></span>
									</div>
									<div class="d-flex gap-1">
										<button th:if="${#strings.toLowerCase(file.fileName).endsWith('.pdf')}" type="button"
											class="btn btn-sm btn-outline-info open-pdf-btn"
											th:data-pdf-url="@{/file/{filePath}(filePath=${file.filePath})}">
											<i class="fa fa-eye me-1"></i> View
										</button>
										<a th:href="@{/file/{filePath}(filePath=${file.filePath})}" target="_blank"
											class="btn btn-sm btn-outline-primary">
											<i class="fa fa-download me-1"></i> Download
										</a>
										<button type="button" class="btn btn-sm btn-outline-danger delete-file-btn"
											th:data-file-id="${file.id}">
											<i class="fa fa-trash me-1"></i> Delete
										</button>
									</div>
								</li>
							</ul>
						</div>
					</div>

					<!-- Photos Card -->
					<div class="card shadow-sm border-0 mb-4" th:if="${!images.isEmpty()}">
						<div class="card-header bg-gradient bg-success text-white border-0">
							<div class="card-title text-white mb-0">
								<i class="fa fa-images me-2"></i> Induction Photos
							</div>
						</div>
						<div class="card-body p-3" style="max-height: 600px; overflow-y: auto;">
							<div class="text-center">
								<div class="mb-3" th:each="file : ${images}">
									<img th:src="@{/file/{filePath}(filePath=${file.filePath})}"
										th:alt="${file.fileName}"
										th:data-src="@{/file/{filePath}(filePath=${file.filePath})}"
										class="img-fluid rounded shadow-sm zoom-image"
										style="max-width: 100%; max-height: 300px; object-fit: cover; border: 1px solid #e9ecef; cursor: pointer; transition: transform 0.2s ease; position: relative;"
										onmouseover="this.style.transform='scale(1.02)'"
										onmouseout="this.style.transform='scale(1)'"
										onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
									<div style="display:none;" class="text-muted small mt-1">
										<i class="fa fa-exclamation-triangle me-1"></i> Image unavailable
									</div>
									<div class="d-flex gap-1 mt-2 justify-content-center">
										<a th:href="@{/file/{filePath}(filePath=${file.filePath})}" target="_blank"
											class="btn btn-sm btn-outline-primary">
											<i class="fa fa-download me-1"></i> Download
										</a>
										<button type="button" class="btn btn-sm btn-outline-danger delete-file-btn"
											th:data-file-id="${file.id}">
											<i class="fa fa-trash me-1"></i> Delete
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Image Zoom Modal -->
		<div class="modal fade" id="imageZoomModal" tabindex="-1" aria-labelledby="imageZoomModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-fullscreen">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="imageZoomModalLabel">Image Preview</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body text-center d-flex align-items-center justify-content-center"
						style="height: calc(100vh - 60px);">
						<img id="zoomedImage" src="" alt="Zoomed Image"
							style="max-width: 95%; max-height: 95%; object-fit: contain;">
					</div>
				</div>
			</div>
		</div>

		<!-- PDF Viewer Modal -->
		<div class="modal fade" id="pdfViewerModal" tabindex="-1" aria-labelledby="pdfViewerModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-xl modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="pdfViewerModalLabel">Document Preview</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body p-0">
						<iframe id="pdfViewerFrame" src="" style="width: 100%; height: 80vh; border: none;"></iframe>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			window.openZoomModal = function (imgElement) {
				const zoomedImage = document.getElementById('zoomedImage');
				zoomedImage.src = imgElement.getAttribute('data-src');
				new bootstrap.Modal(document.getElementById('imageZoomModal')).show();
			};

			window.openPdfModal = function (url) {
				document.getElementById('pdfViewerFrame').src = url;
				new bootstrap.Modal(document.getElementById('pdfViewerModal')).show();
			};

			document.addEventListener('DOMContentLoaded', function () {
				// Handle zoom image clicks
				document.querySelectorAll('.zoom-image').forEach(img => {
					img.addEventListener('click', function () {
						window.openZoomModal(this);
					});
				});

				// Handle PDF view buttons
				document.querySelectorAll('.open-pdf-btn').forEach(btn => {
					btn.addEventListener('click', function (e) {
						e.preventDefault();
						const pdfUrl = this.getAttribute('data-pdf-url');
						window.openPdfModal(pdfUrl);
					});
				});

				// Handle delete file buttons
				document.querySelectorAll('.delete-file-btn').forEach(btn => {
					btn.addEventListener('click', function (e) {
						e.preventDefault();
						const fileId = this.getAttribute('data-file-id');
						deleteFile(fileId);
					});
				});

				// PDF modal cleanup
				const pdfModal = document.getElementById('pdfViewerModal');
				if (pdfModal) {
					pdfModal.addEventListener('hidden.bs.modal', function () {
						document.getElementById('pdfViewerFrame').src = '';
					});
				}

				// Edit button handler
				const editBtn = document.getElementById('editInductionBtn');
				if (editBtn) {
					editBtn.addEventListener('click', function () {
						const code = this.getAttribute('data-induction-code');
						// TODO: Implement edit functionality
						alert('Edit functionality coming soon for: ' + code);
					});
				}
			});

			function deleteFile(fileId) {
				if (!confirm('Are you sure you want to delete this file?')) {
					return;
				}

				fetch('/api/hse-induction/file/' + fileId, {
					method: 'DELETE',
					headers: {
						'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.getAttribute('content')
					}
				})
				.then(response => {
					if (response.ok) {
						alert('File deleted successfully');
						window.location.reload();
					} else {
						alert('Error deleting file');
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('Error deleting file');
				});
			}

			function deleteInduction(event) {
				event.preventDefault();
				if (!confirm('Are you sure you want to delete this induction record? This action cannot be undone.')) {
					return;
				}

				const code = document.getElementById('deleteInductionBtn').getAttribute('data-induction-code');

				fetch('/api/hse-induction/' + code, {
					method: 'DELETE',
					headers: {
						'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.getAttribute('content')
					}
				})
				.then(response => {
					if (response.ok) {
						alert('Induction record deleted successfully');
						window.location.href = '/training/hse-induction';
					} else {
						alert('Error deleting record');
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('Error deleting record');
				});
			}
		</script>
	</th:block>

</body>

</html>
