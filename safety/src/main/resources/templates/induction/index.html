<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>HSE Induction Records Management</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

	<!-- Fonts and icons -->
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () {
				sessionStorage.fonts = true;
			}
		});
	</script>

	<!-- CSS Files -->
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<h3 class="fw-bold mb-3">HSE Induction Records</h3>
					<p class="text-muted">Manage HSE Induction Records</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-primary btn-round" data-bs-toggle="modal" data-bs-target="#addInductionModal">
						<i class="fa fa-plus me-2"></i> Add Record
					</button>
				</div>
			</div>

			<!-- Induction Table -->
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<div class="d-flex align-items-center justify-content-between">
								<h4 class="card-title">Induction Records List</h4>
								<!-- Page size selector -->
								<div class="form-group mb-0">
									<label for="pageSizeSelect" class="sr-only">Items per page:</label>
									<select name="size" id="pageSizeSelect" class="form-control form-control-sm" style="width: 100px;">
										<option value="10" th:selected="${pageSize == 10}">10</option>
										<option value="30" th:selected="${pageSize == 30}">30</option>
										<option value="50" th:selected="${pageSize == 50}">50</option>
										<option value="100" th:selected="${pageSize == 100}">100</option>
									</select>
								</div>
							</div>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover table-head-bg-info">
									<thead>
										<tr>
											<th>Code</th>
											<th>Trainee ID</th>
											<th>Trainee Name</th>
											<th>Date</th>
											<th>Trainer</th>
											<th>Trainer ID</th>
											<th>Files</th>
											<th style="width: 120px;">Actions</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="induction : ${inductionPage.content}" class="clickable-row"
											th:data-induction-code="${induction.code}" style="cursor: pointer;"
											onmouseover="this.style.backgroundColor='#f5f5f5';"
											onmouseout="this.style.backgroundColor='';">
											<td>
												<strong th:text="${induction.code}"></strong>
											</td>
											<td th:text="${induction.traineeId}"></td>
											<td th:text="${induction.traineeName ?: '-'}"></td>
											<td th:text="${induction.inductionDate != null ? #temporals.format(induction.inductionDate, 'yyyy-MM-dd') : '-'}"></td>
											<td th:text="${induction.trainers ?: '-'}"></td>
											<td th:text="${induction.trainerId ?: '-'}"></td>
											<td>
												<span class="badge bg-info" th:if="${induction.filePath != null}">
													<i class="fa fa-file me-1"></i> 1
												</span>
												<span class="badge bg-secondary" th:if="${induction.filePath == null}">0</span>
											</td>
											<td>
												<div class="btn-group btn-group-sm" role="group">
													<a th:href="@{/training/hse-induction/{code}(code=${induction.code})}" class="btn btn-sm btn-info" title="View">
														<i class="fa fa-eye"></i>
													</a>
													<button type="button" class="btn btn-sm btn-danger delete-btn" th:data-code="${induction.code}" title="Delete">
														<i class="fa fa-trash"></i>
													</button>
												</div>
											</td>
										</tr>
										<tr th:if="${inductionPage.content.isEmpty()}">
											<td colspan="8" class="text-center text-muted py-4">
												<i class="fa fa-inbox fa-2x mb-2 d-block"></i>
												No HSE Induction records found.
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Pagination -->
			<div class="row mt-4">
				<div class="col-md-12">
					<nav aria-label="Page navigation">
						<ul class="pagination justify-content-center mb-0">
							<li class="page-item" th:classappend="${!inductionPage.hasPrevious} ? 'disabled'">
								<a class="page-link"
									th:href="@{/training/hse-induction(page=${inductionPage.number - 1}, size=${pageSize})}"
									th:if="${inductionPage.hasPrevious}">Previous</a>
								<span class="page-link" th:if="${!inductionPage.hasPrevious}">Previous</span>
							</li>
							<li class="page-item active">
								<span class="page-link" th:text="${inductionPage.number + 1}">1</span>
							</li>
							<li class="page-item">
								<span class="page-link text-muted">of <span
										th:text="${inductionPage.totalPages}">1</span></span>
							</li>
							<li class="page-item" th:classappend="${!inductionPage.hasNext} ? 'disabled'">
								<a class="page-link"
									th:href="@{/training/hse-induction(page=${inductionPage.number + 1}, size=${pageSize})}"
									th:if="${inductionPage.hasNext}">Next</a>
								<span class="page-link" th:if="${!inductionPage.hasNext}">Next</span>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>

		<!-- Induction Modal Fragment -->
		<div th:replace="~{fragments/induction-modal :: addInductionModal}"></div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				// Clickable rows - navigate to detail page
				const clickableRows = document.querySelectorAll('.clickable-row');
				clickableRows.forEach(row => {
					row.addEventListener('click', function (e) {
						if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.closest('a.btn')) return;
						const code = this.getAttribute('data-induction-code');
						if (code) window.location.href = '/training/hse-induction/' + code;
					});
				});

				// Page size selector
				const pageSizeSelect = document.getElementById('pageSizeSelect');
				if (pageSizeSelect) {
					pageSizeSelect.addEventListener('change', function () {
						const url = new URL(window.location.href);
						url.searchParams.set('size', this.value);
						url.searchParams.set('page', '0');
						window.location.href = url.toString();
					});
				}

				// Delete functionality
				const deleteButtons = document.querySelectorAll('.delete-btn');
				deleteButtons.forEach(btn => {
					btn.addEventListener('click', function (e) {
						e.preventDefault();
						e.stopPropagation();
						const code = this.getAttribute('data-code');
						if (confirm('Are you sure you want to delete this record?')) {
							fetch('/api/hse-induction/' + code, {
								method: 'DELETE',
								headers: {
									'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.getAttribute('content')
								}
							})
							.then(response => {
								if (response.ok) {
									alert('Record deleted successfully!');
									window.location.reload();
								} else {
									alert('Error deleting record');
								}
							})
							.catch(error => {
								console.error('Error:', error);
								alert('Error deleting record');
							});
						}
					});
				});
			});
		</script>
	</th:block>

</body>

</html>
