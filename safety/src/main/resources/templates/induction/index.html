<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>HSE Induction Records Management</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

	<!-- Fonts and icons -->
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () {
				sessionStorage.fonts = true;
			}
		});
	</script>

	<!-- CSS Files -->
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">

	<!-- CSS Just for demo purpose, don't include it in your project -->
	<link rel="stylesheet" href="/assets/css/demo.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<h3 class="fw-bold mb-3">HSE Induction Records</h3>
					<p class="text-muted">Manage HSE Induction Records</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-primary btn-round dropdown-toggle me-2" id="exportDropdown"
						data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
						<i class="fa fa-upload me-1"></i> Export
					</button>
					<div class="dropdown-menu dropdown-menu-right mt-2" aria-labelledby="exportDropdown">
						<a class="dropdown-item" href="#" id="exportExcel">
							<i class="fa fa-file-excel me-2 text-success"></i> Excel
						</a>
						<a class="dropdown-item" href="#" id="exportPdf">
							<i class="fa fa-file-pdf me-2 text-danger"></i> PDF
						</a>
					</div>
					<a href="/training/hse-induction/new" class="btn btn-primary btn-round">
						<i class="fa fa-plus me-2"></i> Add Record
					</a>
				</div>
			</div>

			<!-- Induction Table -->
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<!-- Filters Section -->
							<div class="d-flex align-items-center justify-content-end">
								<div class="dropdown form-inline me-2">
									<button class="btn btn-primary dropdown-toggle" type="button" id="filterDropdownBtn"
										data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
										style="padding: 0.375rem 0.5rem;">
										<i class="fa fa-filter"></i> Filter
									</button>
									<div class="dropdown-menu p-3" aria-labelledby="filterDropdownBtn"
										style="min-width: 350px; max-width: 400px; width: 100%;">
										<div class="form-group pb-0">
											<label class="form-label small d-block">Search</label>
											<div class="input-icon w-100">
												<input type="text" name="keyword"
													class="form-control form-control-sm w-100"
													placeholder="Induction Code, Name...">
												<span class="input-icon-addon"><i class="fa fa-search"></i></span>
											</div>
										</div>
										<div class="form-group pb-0">
											<label class="form-label small d-block">Induction Date</label>
											<div class="input-group input-daterange w-100">
												<input type="date" name="inductionDateFrom"
													class="form-control form-control-sm" placeholder="From">
												<div class="input-group-prepend input-group-append">
													<span class="input-group-text">to</span>
												</div>
												<input type="date" name="inductionDateTo"
													class="form-control form-control-sm" placeholder="To">
											</div>
										</div>
										<div class="form-group pb-0">
											<label class="form-label small d-block">Category</label>
											<select name="category" class="form-control form-control-sm w-100">
												<option value="">All Categories</option>
												<option value="GENERAL">General</option>
												<option value="SAFETY">Safety</option>
												<option value="EQUIPMENT">Equipment</option>
												<option value="EMERGENCY">Emergency</option>
												<option value="OTHER">Other</option>
											</select>
										</div>
										<div class="form-group pb-0">
											<label class="form-label small d-block">Created By</label>
											<div class="position-relative w-100">
												<input type="text" class="form-control form-control-sm w-100"
													id="filterCreatorInput" placeholder="Search by name or ID"
													autocomplete="off" />
												<div id="filterCreatorDropdown" class="dropdown-menu w-100"
													style="position: absolute; z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-top: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
												</div>
											</div>
											<select class="d-none" name="creatorEmpId" id="filterCreatorSelect">
												<option value=""></option>
											</select>
											<input type="hidden" name="creatorEmpId" id="filterCreatorHidden" />
										</div>

										<button type="button" class="btn btn-primary btn-sm btn-block mt-2"
											id="applyFilters">
											<i class="fas fa-check"></i> Apply Filters
										</button>
										<button type="button" class="btn btn-secondary btn-sm btn-block mt-2"
											id="resetFilters">
											<i class="fas fa-undo"></i> Reset
										</button>
									</div>
								</div>
								<!-- End of Filters Section -->

								<!-- columns filter section -->
								<div class="dropdown me-2">
									<button class="btn btn-primary dropdown-toggle" type="button"
										id="columnToggleDropdown" data-bs-toggle="dropdown" aria-haspopup="true"
										aria-expanded="false" style="padding: 0.375rem 0.5rem;">
										<i class="fas fa-th-list"></i>
									</button>
									<div class="dropdown-menu dropdown-menu-right"
										aria-labelledby="columnToggleDropdown"
										style="min-width: 250px; max-height: 300px; overflow-y: auto; padding: 0.5rem 0;">
										<h6 class="dropdown-header px-3 py-2">Show / Hide Columns</h6>
										<div id="column-toggle-list"></div>
									</div>
								</div>
								<!-- columns filter section end -->

								<!-- page size selector -->
								<div class="form-group">
									<label for="pageSizeSelect" class="sr-only">Items per page:</label>
									<select name="size" id="pageSizeSelect" class="form-control form-control">
										<option value="10" selected>10</option>
										<option value="30">30</option>
										<option value="50">50</option>
										<option value="100">100</option>
										<option value="300">300</option>
										<option value="500">500</option>
									</select>
								</div>
								<!-- page size selector end -->
							</div>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover table-responsive table-head-bg-info">
									<thead>
										<tr>
											<th>Code</th>
											<th>Induction Name</th>
											<th>Category</th>
											<th>Date</th>
											<th>Value</th>
											<th>Created By</th>
											<th>Files</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="induction : ${inductionPage.content}" class="clickable-row"
											th:data-induction-code="${induction.code}" style="cursor: pointer;"
											onmouseover="this.style.backgroundColor='#f5f5f5';"
											onmouseout="this.style.backgroundColor='';">
											<td><strong th:text="${induction.code}"></strong></td>
											<td th:text="${induction.inductionName}"></td>
											<td th:text="${induction.category}"></td>
											<td th:text="${induction.inductionDate != null ? #temporals.format(induction.inductionDate, 'yyyy-MM-dd') : ''}"></td>
											<td th:text="${induction.value ?: '-'}"></td>
											<td th:text="${induction.createdBy != null ? induction.createdBy.username : 'Unknown'}"></td>
											<td>
												<span class="badge bg-info" th:text="${induction.files.size() ?: '0'}">0</span>
											</td>
										</tr>
										<tr th:if="${inductionPage.content.isEmpty()}">
											<td colspan="7" class="text-center text-muted py-4">
												<i class="fa fa-inbox fa-2x mb-2 d-block"></i>
												No HSE Induction records found.
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Pagination -->
			<div class="row mt-4">
				<div class="col-md-12">
					<nav aria-label="Page navigation">
						<ul class="pagination justify-content-center mb-0">
							<li class="page-item" th:classappend="${!inductionPage.hasPrevious} ? 'disabled'">
								<a class="page-link"
									th:href="@{/training/hse-induction(page=${inductionPage.number - 1}, size=${pageSize})}"
									th:if="${inductionPage.hasPrevious}">Previous</a>
								<span class="page-link" th:if="${!inductionPage.hasPrevious}">Previous</span>
							</li>
							<li class="page-item active">
								<span class="page-link" th:text="${inductionPage.number + 1}">1</span>
							</li>
							<li class="page-item">
								<span class="page-link text-muted">of <span
										th:text="${inductionPage.totalPages}">1</span></span>
							</li>
							<li class="page-item" th:classappend="${!inductionPage.hasNext} ? 'disabled'">
								<a class="page-link"
									th:href="@{/training/hse-induction(page=${inductionPage.number + 1}, size=${pageSize})}"
									th:if="${inductionPage.hasNext}">Next</a>
								<span class="page-link" th:if="${!inductionPage.hasNext}">Next</span>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				// Clickable rows - navigate to detail page
				const clickableRows = document.querySelectorAll('.clickable-row');
				clickableRows.forEach(row => {
					row.addEventListener('click', function (e) {
						if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
						const code = this.getAttribute('data-induction-code');
						if (code) window.location.href = '/training/hse-induction/' + code;
					});
				});

				// Page size selector
				const pageSizeSelect = document.getElementById('pageSizeSelect');
				if (pageSizeSelect) {
					pageSizeSelect.addEventListener('change', function () {
						const url = new URL(window.location.href);
						url.searchParams.set('size', this.value);
						url.searchParams.set('page', '0');
						window.location.href = url.toString();
					});
				}

				// Apply filters
				document.getElementById('applyFilters')?.addEventListener('click', function () {
					const params = new URLSearchParams();
					params.set('page', '0');
					const size = pageSizeSelect?.value;
					if (size) params.set('size', size);
					const keyword = document.querySelector('[name="keyword"]')?.value?.trim();
					if (keyword) params.set('keyword', keyword);
					const dateFrom = document.querySelector('[name="inductionDateFrom"]')?.value;
					if (dateFrom) params.set('inductionDateFrom', dateFrom);
					const dateTo = document.querySelector('[name="inductionDateTo"]')?.value;
					if (dateTo) params.set('inductionDateTo', dateTo);
					const category = document.querySelector('[name="category"]')?.value;
					if (category) params.set('category', category);
					const creatorEmpId = document.getElementById('filterCreatorHidden')?.value;
					if (creatorEmpId) params.set('creatorEmpId', creatorEmpId);
					window.location.href = '/training/hse-induction?' + params.toString();
				});

				// Reset filters
				document.getElementById('resetFilters')?.addEventListener('click', function () {
					window.location.href = '/training/hse-induction';
				});

				// Export Excel (placeholder)
				document.getElementById('exportExcel')?.addEventListener('click', function (e) {
					e.preventDefault();
					alert('Export to Excel feature coming soon');
				});

				// Export PDF (placeholder)
				document.getElementById('exportPdf')?.addEventListener('click', function (e) {
					e.preventDefault();
					alert('Export to PDF feature coming soon');
				});
			});
		</script>
	</th:block>

</body>

</html>
