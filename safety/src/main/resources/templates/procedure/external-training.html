<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>HSE External Training Record</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () { sessionStorage.fonts = true; }
		});
	</script>
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<h3 class="fw-bold mb-3">HSE External Training Record</h3>
					<p class="text-muted">Manage HSE External Training Records</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-primary btn-round">
						<i class="fa fa-plus me-2"></i> Add Record
					</button>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<div class="card-title">HSE External Training Records</div>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover table-head-bg-primary">
									<thead>
										<tr>
											<th>#</th>
											<th>Training Name</th>
											<th>Provider</th>
											<th>Date</th>
											<th>Employee</th>
											<th>Duration</th>
											<th>Actions</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td colspan="7" class="text-center text-muted py-4">
												<i class="fas fa-external-link-alt fa-2x mb-2 d-block"></i>
												No external training records found.
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
