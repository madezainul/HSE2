<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>HSE External Training Detail</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

	<!-- Fonts and icons -->
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () {
				sessionStorage.fonts = true;
			}
		});
	</script>

	<!-- CSS Files -->
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<a href="/training/hse-external-training" class="btn btn-secondary btn-sm mb-3">
						<i class="fa fa-arrow-left me-2"></i> Back to List
					</a>
					<h2 class="fw-bold mb-2 text-dark" th:text="'HSE External Training: ' + ${training.code}">HSE External Training Detail</h2>
					<p class="text-muted mb-0">
						<i class="fa fa-calendar-alt me-2"></i>
						<span th:text="${training.trainingDate != null ? #temporals.format(training.trainingDate, 'dd MMMM, yyyy') : 'N/A'}"></span>
					</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-danger btn-round" id="deleteTrainingBtn"
						sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" th:data-training-code="${training.code}"
						onclick="deleteTraining(event)">
						<i class="fa fa-trash me-2"></i> Delete
					</button>
				</div>
			</div>

			<div class="row">
				<!-- Main Details Column -->
				<div class="col-md-8">
					<div class="card mb-4 shadow-sm border-0">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Training Information</div>
						</div>
						<div class="card-body">
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Code</label>
										<p class="text-muted" th:text="${training.code}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Employee ID</label>
										<p class="text-muted" th:text="${training.employeeId}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Employee Name</label>
										<p class="text-muted" th:text="${training.employeeName ?: 'N/A'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Training Name</label>
										<p class="text-muted" th:text="${training.trainingName}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Provider</label>
										<p class="text-muted" th:text="${training.provider}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Date</label>
										<p class="text-muted"
											th:text="${training.trainingDate != null ? #temporals.format(training.trainingDate, 'dd MMMM, yyyy') : 'N/A'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Duration (Hours)</label>
										<p class="text-muted" th:text="${training.duration ?: 'N/A'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Remarks</label>
										<p class="text-muted" th:text="${training.remarks ?: 'N/A'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Created By</label>
										<p class="text-muted" th:text="${training.createdBy != null ? training.createdBy.username : 'Unknown'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Created At</label>
										<p class="text-muted"
											th:text="${training.createdAt != null ? #temporals.format(training.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></p>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Sidebar Column -->
				<div class="col-md-4">
					<!-- Summary Card -->
					<div class="card mb-4 shadow-sm border-0">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Summary</div>
						</div>
						<div class="card-body">
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Employee</p>
									<p class="fw-bold mb-0" th:text="${training.employeeName ?: training.employeeId}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Training</p>
									<p class="fw-bold mb-0" th:text="${training.trainingName}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Provider</p>
									<p class="fw-bold mb-0" th:text="${training.provider}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Training Date</p>
									<p class="fw-bold mb-0"
										th:text="${training.trainingDate != null ? #temporals.format(training.trainingDate, 'dd/MM/yyyy') : 'N/A'}"></p>
								</div>
							</div>
							<hr>
							<div class="row">
								<div class="col-12">
									<p class="text-muted small mb-1">Last Updated</p>
									<p class="fw-bold mb-0"
										th:text="${training.updatedAt != null ? #temporals.format(training.updatedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></p>
								</div>
							</div>
						</div>
					</div>

					<!-- File Card -->
					<div class="card shadow-sm border-0 mb-4" th:if="${training.filePath != null}">
						<div class="card-header bg-gradient bg-success text-white border-0">
							<div class="card-title text-white mb-0">
								<i class="fa fa-file me-2"></i> Attached File
							</div>
						</div>
						<div class="card-body p-3">
							<div class="d-flex align-items-center mb-3">
								<i th:class="${training.getFileIconClass()}" style="font-size: 1.5rem;"></i>
								<div class="ms-3 flex-grow-1">
									<p class="mb-1 fw-bold text-truncate" th:title="${training.originalFileName}" th:text="${training.originalFileName}"></p>
									<small class="text-muted" th:text="${training.getFormattedFileSize()}"></small>
								</div>
							</div>
							<div class="d-flex gap-2">
								<a th:href="@{'/file/download/' + ${training.filePath}}"
									class="btn btn-sm btn-outline-primary flex-grow-1">
									<i class="fa fa-download me-1"></i> Download
								</a>
								<a th:href="@{'/file/' + ${training.filePath}}" target="_blank"
									class="btn btn-sm btn-outline-info flex-grow-1">
									<i class="fa fa-external-link-alt me-1"></i> Open
								</a>
							</div>
						</div>
					</div>

					<!-- No File Message -->
					<div class="card shadow-sm border-0 mb-4" th:if="${training.filePath == null}">
						<div class="card-body text-center p-4">
							<i class="fa fa-file fa-2x text-muted mb-3 d-block"></i>
							<p class="text-muted mb-0">No file attached</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			function deleteTraining(event) {
				event.preventDefault();
				if (!confirm('Are you sure you want to delete this training record? This action cannot be undone.')) {
					return;
				}

				const code = document.getElementById('deleteTrainingBtn').getAttribute('data-training-code');

				fetch('/api/hse-external-training/' + code, {
					method: 'DELETE',
					headers: {
						'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.getAttribute('content')
					}
				})
				.then(response => {
					if (response.ok) {
						alert('Training record deleted successfully');
						window.location.href = '/training/hse-external-training';
					} else {
						alert('Error deleting record');
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('Error deleting record');
				});
			}
		</script>
	</th:block>

</body>

</html>
