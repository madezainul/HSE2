<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Certification</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () { sessionStorage.fonts = true; }
		});
	</script>
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<h3 class="fw-bold mb-3">Certification</h3>
					<p class="text-muted">Manage Certification Records</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-primary btn-round" data-bs-toggle="modal" data-bs-target="#addCertificationModal">
						<i class="fa fa-plus me-2"></i> Add Record
					</button>
				</div>
			</div>

			<!-- Recent Records Table -->
			<div class="row">
				<div class="col-md-12">
					<div class="card shadow-sm border-0">
						<div class="card-header bg-gradient bg-info text-white border-0">
							<div class="card-title text-white mb-0">
								<i class="fa fa-clock me-2"></i> Recent Records
							</div>
						</div>
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover table-sm">
									<thead>
										<tr>
											<th>Code</th>
											<th>Certificate Name</th>
											<th>Employee</th>
											<th>Issued Date</th>
											<th>Expiry Date</th>
											<th>Status</th>
											<th style="width: 80px;">Actions</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="record : ${recentRecords}">
											<td>
												<strong th:text="${record.code}"></strong>
											</td>
											<td th:text="${record.certificateName}"></td>
											<td th:text="${record.employeeName ?: record.employeeId}"></td>
											<td th:text="${record.issuedDate != null ? #temporals.format(record.issuedDate, 'yyyy-MM-dd') : '-'}"></td>
											<td th:text="${record.expiryDate != null ? #temporals.format(record.expiryDate, 'yyyy-MM-dd') : '-'}"></td>
											<td><span th:class="${record.statusBadgeClass}" th:text="${record.status}"></span></td>
											<td>
												<a th:href="@{/training/hse-certification/{code}(code=${record.code})}" class="btn btn-sm btn-info" title="View">
													<i class="fa fa-eye"></i>
												</a>
											</td>
										</tr>
										<tr th:if="${#lists.isEmpty(recentRecords)}">
											<td colspan="7" class="text-center text-muted py-4">
												<i class="fa fa-inbox fa-2x mb-2 d-block"></i>
												No certification records yet
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="text-center mt-3" th:if="${!#lists.isEmpty(recentRecords)}">
								<a href="/training/hse-certification" class="btn btn-secondary btn-sm">
									<i class="fa fa-arrow-right me-2"></i> View All Records
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Certification Modal Fragment -->
		<div th:replace="~{fragments/certification-modal :: addCertificationModal}"></div>
	</div>
</body>
</html>
