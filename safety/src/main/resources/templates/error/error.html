<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Public Sans', sans-serif;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .error-details {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .error-timestamp {
            color: #999;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 30px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn-back:hover {
            background-color: #764ba2;
            text-decoration: none;
        }
        .error-path {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            font-family: monospace;
            word-break: break-all;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code" th:text="${status}">500</div>
        <div class="error-message" th:text="${error}">Internal Server Error</div>
        <div class="error-details" th:text="${message}">An unexpected error occurred.</div>
        <div class="error-timestamp" th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></div>
        
        <div th:if="${path}" class="error-path">
            Path: <span th:text="${path}"></span>
        </div>
        
        <a href="/" class="btn-back">Back to Home</a>
    </div>
</body>
</html>
