<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: url('/assets/img/500error.jpg') center/cover no-repeat;
            font-family: 'Public Sans', sans-serif;
            position: relative;
        }

        .error-container {
            text-align: center;
            padding: 40px;
        }

        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .error-details {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 30px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .btn-back:hover {
            background-color: #764ba2;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <a href="/" class="btn-back">Back to Home</a>
    </div>
</body>

</html>
