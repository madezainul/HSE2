<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>User Management</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

	<!-- Fonts and icons -->
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () {
				sessionStorage.fonts = true;
			}
		});
	</script>

	<!-- CSS Files -->
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">

	<!-- CSS Just for demo purpose, don't include it in your project -->
	<link rel="stylesheet" href="/assets/css/demo.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Flash messages -->
			<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
				<i class="fa fa-check-circle me-2"></i>
				<span th:text="${successMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<i class="fa fa-exclamation-circle me-2"></i>
				<span th:text="${errorMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<h3 class="fw-bold mb-3">User Management</h3>
					<p class="text-muted">Manage and track all system users</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<a href="/auth/register" class="btn btn-primary btn-round">
						<i class="fa fa-plus me-2"></i> Add New User
					</a>
				</div>
			</div>

			<!-- Users Table -->
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<!-- Filters Section -->
						<div class="row g-3 p-3 px-4 pt-4">
							<div class="col-md-4">
								<label class="form-label">Search</label>
								<input type="text" class="form-control form-control-sm" placeholder="Search by Employee ID, Name, or Email...">
							</div>
							<div class="col-md-3">
								<label class="form-label">Role</label>
								<select class="form-select form-select-sm">
									<option selected>All Roles</option>
									<option>Admin</option>
									<option>Manager</option>
									<option>User</option>
									<option>Viewer</option>
								</select>
							</div>
							<div class="col-md-2">
								<label class="form-label">Status</label>
								<select class="form-select form-select-sm">
									<option selected>All Status</option>
									<option>Active</option>
									<option>Inactive</option>
								</select>
							</div>
							<div class="col-md-2">
								<label class="form-label">&nbsp;</label>
								<button class="btn btn-sm btn-info w-100">
									<i class="fa fa-filter me-2"></i> Filter
								</button>
							</div>
						</div>
						<!-- End of Filters Section -->
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover table-responsive table-head-bg-info">
									<thead>
										<tr>
											<th>Photo</th>
											<th>Employee ID</th>
											<th>Name</th>
											<th>Email</th>
											<th>Role</th>
											<th>Position</th>
											<th>Status</th>
											<th>Actions</th>
										</tr>
									</thead>
									<tbody>
										<!-- Dynamic User Data from Database -->
										<tr th:each="user : ${usersPage.content}">
											<td>
												<img th:src="${user.profilePicture != null ? '/file/' + user.profilePicture : '/assets/img/no_image.png'}"
													th:alt="${user.fullName}"
													style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #dee2e6;">
											</td>
											<td><strong th:text="${user.employeeId}" th:data-user-id="${user.id}"></strong></td>
											<td th:text="${user.fullName}"></td>
											<td th:text="${user.email}"></td>
											<td>
												<span class="badge" th:classappend="${
													user.role == 'admin' ? 'bg-danger' :
													user.role == 'manager' ? 'bg-warning' :
													user.role == 'user' ? 'bg-info' :
													user.role == 'employee' ? 'bg-success' :
													'bg-secondary'
												}" th:text="${
													user.role == 'admin' ? 'Administrator' :
													user.role == 'manager' ? 'Manager' :
													user.role == 'user' ? 'User' :
													user.role == 'employee' ? 'Employee' :
													(user.role ?: 'N/A')
												}"></span>
											</td>
											<td th:text="${
												user.department == 'admin' ? 'Administration' :
												user.department == 'safety' ? 'Safety' :
												user.department == 'operations' ? 'Operations' :
												user.department == 'hr' ? 'Human Resources' :
												user.department == 'it' ? 'IT' :
												user.department == 'qc' ? 'QC' :
												user.department == 'production' ? 'Production' :
												user.department == 'maintenance' ? 'Maintenance' :
												(user.department ?: 'N/A')
											}"></td>
											<td>
												<span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-danger'}" th:text="${user.enabled ? 'Active' : 'Inactive'}"></span>
											</td>
											<td>
												<a th:href="@{/user/{id}/edit(id=${user.id})}" class="btn btn-sm btn-warning me-2" title="Edit">
													<i class="fa fa-edit"></i>
												</a>
												<form th:action="@{/user/{id}/delete(id=${user.id})}" method="post" class="d-inline delete-user-form"
													th:data-name="${user.fullName}">
													<button type="submit" class="btn btn-sm btn-danger" title="Delete">
														<i class="fa fa-trash"></i>
													</button>
												</form>
											</td>
										</tr>
										<!-- Empty state message -->
										<tr th:if="${usersPage.isEmpty()}">
											<td colspan="8" class="text-center text-muted py-4">
												<i class="fa fa-inbox fa-2x mb-3"></i>
												<p>No users found</p>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Pagination -->
			<div class="row" th:if="${usersPage.totalPages > 1}">
				<div class="col-md-12">
					<nav aria-label="Page navigation">
						<ul class="pagination justify-content-center">
							<!-- Previous button -->
							<li class="page-item" th:classappend="${usersPage.isFirst() ? 'disabled' : ''}">
								<a class="page-link" th:href="@{/user(page=${usersPage.number - 1}, size=${usersPage.size})}" tabindex="-1">Previous</a>
							</li>

							<!-- Page numbers -->
							<th:block th:each="i : ${#numbers.sequence(0, usersPage.totalPages - 1)}">
								<li class="page-item" th:classappend="${i == usersPage.number ? 'active' : ''}">
									<a class="page-link" th:href="@{/user(page=${i}, size=${usersPage.size})}" th:text="${i + 1}"></a>
								</li>
							</th:block>

							<!-- Next button -->
							<li class="page-item" th:classappend="${usersPage.isLast() ? 'disabled' : ''}">
								<a class="page-link" th:href="@{/user(page=${usersPage.number + 1}, size=${usersPage.size})}">Next</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>

			<!-- Page info -->
			<div class="row">
				<div class="col-md-12 text-center text-muted py-3">
					<small>Showing <span th:text="${usersPage.numberOfElements}"></span> of <span th:text="${usersPage.totalElements}"></span> users</small>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			document.querySelectorAll('.delete-user-form').forEach(function (form) {
				form.addEventListener('submit', function (e) {
					var name = this.getAttribute('data-name') || 'this user';
					if (!confirm('Are you sure you want to delete user "' + name + '"? This action cannot be undone.')) {
						e.preventDefault();
					}
				});
			});
		</script>
	</th:block>
</body>

</html>
