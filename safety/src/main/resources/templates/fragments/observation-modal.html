<th:block xmlns:th="http://www.thymeleaf.org">
    <!-- Add Observation Modal Fragment -->
    <div class="modal fade" id="addObservationModal" th:fragment="addObservationModal" tabindex="-1"
        aria-labelledby="addObservationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addObservationModalLabel">Record New Observation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addObservationForm">
                    <!-- Hidden field for observation code (used in UPDATE mode) -->
                    <input type="hidden" id="observationCodeHidden" value="">
                    
                    <div class="modal-body">

                        <!-- Row 1: Date & Area -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="observationDate" class="form-label">Observation Date & Time <span class="text-danger">*</span></label>
                                    <input type="datetime-local" class="form-control" id="observationDate"
                                        name="observationDate" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="areaInput" class="form-label">Area <span class="text-danger">*</span></label>
                                    <div style="position: relative;">
                                        <input type="text" class="form-control" id="areaInput"
                                            placeholder="Search area by name or code" autocomplete="off" />
                                        <div id="areaDropdown" class="dropdown-menu"
                                            style="position: absolute; left: 0; right: 0; width: 100%; top: calc(100% + 0.125rem); display: none; max-height: 200px; overflow-y: auto; min-width: unset; padding: 0.5rem 0; border-radius: var(--bs-border-radius); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);">
                                        </div>
                                    </div>
                                    <input type="hidden" name="areaCode" id="areaHidden" />
                                </div>
                            </div>
                        </div>

                        <!-- Row 2: Category & Type -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                                    <select class="form-select" id="category" name="category" required>
                                        <option value="" disabled selected>Select category</option>
                                        <th:block th:each="category : ${T(ahqpck.hse.safety.model.entity.Observation.Category).values()}">
                                            <option th:value="${category}" th:text="${category.getDisplayName()}"
                                                th:selected="${param.category == category}"></option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
                                    <select class="form-select" id="type" name="type" required>
                                        <option value="" disabled selected>Select type</option>
                                        <th:block th:each="type : ${T(ahqpck.hse.safety.model.entity.Observation.Type).values()}">
                                            <option th:value="${type}" th:text="${type.getDisplayName()}"
                                                th:selected="${param.type == type}"></option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <div class="form-group">
                                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                    placeholder="Provide detailed description of the observation..." required></textarea>
                            </div>
                        </div>

                        <!-- Row 3: Status & Mitigation -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                                    <select class="form-select" id="status" name="status" required>
                                        <option value="" disabled selected>Select status</option>
                                        <th:block th:each="status : ${T(ahqpck.hse.safety.model.entity.Observation.Status).values()}">
                                            <option th:value="${status}" th:text="${status.getDisplayName()}"
                                                th:selected="${param.status == status}"></option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="mitigation" class="form-label">Mitigation Level <span class="text-danger">*</span></label>
                                    <select class="form-select" id="mitigation" name="mitigation" required>
                                        <option value="" disabled selected>Select mitigation level</option>
                                        <th:block th:each="mitigation : ${T(ahqpck.hse.safety.model.entity.Observation.Mitigation).values()}">
                                            <option th:value="${mitigation}" th:text="${mitigation.getDisplayName()}"
                                                th:selected="${param.mitigation == mitigation}"></option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Row 4: Observer & Responsible Person -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="observerName" class="form-label">Observer</label>
                                    <div style="position: relative;">
                                        <input type="text" class="form-control" id="observerName" name="observerName"
                                            placeholder="Search observer by name or ID" autocomplete="off" />
                                        <div id="observerDropdown" class="dropdown-menu"
                                            style="position: absolute; left: 0; right: 0; width: 100%; top: calc(100% + 0.125rem); display: none; max-height: 200px; overflow-y: auto; min-width: unset; padding: 0.5rem 0; border-radius: var(--bs-border-radius); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);">
                                        </div>
                                    </div>
                                    <input type="hidden" name="observerId" id="observerHidden" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="responsibleName" class="form-label">Responsible Person</label>
                                    <div style="position: relative;">
                                        <input type="text" class="form-control" id="responsibleName" name="responsibleName"
                                            placeholder="Search responsible by name or ID" autocomplete="off" />
                                        <div id="responsibleDropdown" class="dropdown-menu"
                                            style="position: absolute; left: 0; right: 0; width: 100%; top: calc(100% + 0.125rem); display: none; max-height: 200px; overflow-y: auto; min-width: unset; padding: 0.5rem 0; border-radius: var(--bs-border-radius); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);">
                                        </div>
                                    </div>
                                    <input type="hidden" name="responsibleId" id="responsibleHidden" />
                                </div>
                            </div>
                        </div>

                        <!-- Corrective Action -->
                        <div class="mb-3">
                            <div class="form-group">
                                <label for="correctiveAction" class="form-label">Corrective Action</label>
                                <textarea class="form-control" id="correctiveAction" name="correctiveAction" rows="2"
                                    placeholder="What action will be taken to address this observation..."></textarea>
                            </div>
                        </div>

                        <!-- Remarks -->
                        <div class="mb-3">
                            <div class="form-group">
                                <label for="remarks" class="form-label">Remarks</label>
                                <textarea class="form-control" id="remarks" name="remarks" rows="2"
                                    placeholder="Any additional remarks or notes..."></textarea>
                            </div>
                        </div>

                        <!-- File Upload Section -->
                        <hr>
                        <h6 class="mb-3 text-muted">Attachments <small class="text-muted fw-normal">(optional, can be added after saving)</small></h6>

                        <!-- Observation Images -->
                        <div class="mb-3">
                            <div class="form-group">
                                <label for="observationImages" class="form-label">
                                    <i class="fa fa-image me-1"></i> Observation Images
                                </label>
                                <input type="file" class="form-control" id="observationImages" name="observationImages"
                                    accept=".jpg,.jpeg,.png,.webp" multiple>
                                <div class="form-text">Accepted: JPG, PNG, WEBP. Max 10MB per file.</div>
                            </div>
                        </div>

                        <!-- Observation Documents -->
                        <div class="mb-3">
                            <div class="form-group">
                                <label for="observationDocuments" class="form-label">
                                    <i class="fa fa-paperclip me-1"></i> Attachments / Documents
                                </label>
                                <input type="file" class="form-control" id="observationDocuments" name="observationDocuments"
                                    accept=".pdf,.doc,.docx,.xls,.xlsx" multiple>
                                <div class="form-text">Accepted: PDF, DOC, DOCX, XLS, XLSX. Max 10MB per file.</div>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submitObservationBtn">
                            <i class="fa fa-save me-2"></i> Record Observation
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script for Observation Index Module (Live Search) -->
    <script th:src="@{/assets/js/custom/observation-index.js}"></script>
    <!-- Script for Observation Modal Live Search -->
    <script th:src="@{/assets/js/custom/observation-modal.js}"></script>
    <!-- Script for Observation Form Submission + File Upload -->
    <script th:src="@{/assets/js/custom/observation-form.js}"></script>
</th:block>
