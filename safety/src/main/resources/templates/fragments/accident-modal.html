<div class="modal fade" id="addAccidentModal" th:fragment="addAccidentModal" tabindex="-1"
	aria-labelledby="addAccidentModalLabel" aria-hidden="true" xmlns:th="http://www.thymeleaf.org">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="addAccidentModalLabel">Report New Accident</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>

			<div class="modal-body">
				<form th:action="@{/observation/accident}" th:object="${accidentDTO}" method="POST" id="addAccidentForm" enctype="multipart/form-data">

					<input type="hidden" name="redirectUrl" id="redirectUrl">
					<datalist id="areaOptions"></datalist>
					<datalist id="affectedPersonOptions"></datalist>
					<datalist id="witnessOptions"></datalist>

					<div class="row">
						<div class="col-md-6">
							<div class="form-group">
								<label for="accidentDate" class="form-label">Accident Date & Time <span
										class="text-danger">*</span></label>
								<input type="datetime-local" class="form-control" th:field="*{accidentDate}" id="accidentDate" required>
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-group">
								<label>Area</label>
								<div style="position: relative;">
									<input type="text" class="form-control" id="areaInput" name="areaName"
									placeholder="Search area by name or code" autocomplete="off" />
									<div id="dropdown" class="dropdown-menu"
										style="position: absolute; left: 0; right: 0; width: 100%; top: calc(100% + 0.125rem); display: none; max-height: 200px; overflow-y: auto; min-width: unset; padding: 0.5rem 0; border-radius: var(--bs-border-radius); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);">
									</div>
								</div>
								<input type="hidden" id="areaHidden" th:field="*{area.code}" />
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6">
							<div class="form-group">
								<label for="severity" class="form-label">Severity Level <span
										class="text-danger">*</span></label>
								<select class="form-select" th:field="*{severity}" id="severity" required>
									<option value="" disabled selected>Select severity level</option>
									<th:block th:each="severity : ${T(ahqpck.hse.safety.model.entity.Accident.SeverityLevel).values()}">
										<option th:value="${severity}" th:text="${severity}" th:selected="${param.severity == severity}"></option>
									</th:block>
								</select>
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-group">
								<label for="status" class="form-label">Status <span class="text-danger">*</span></label>
								<select class="form-select" th:field="*{status}" id="status" required>
									<option value="" disabled selected>Select status</option>
									<th:block th:each="status : ${T(ahqpck.hse.safety.model.entity.Accident.AccidentStatus).values()}">
										<option th:value="${status}" th:text="${status}" th:selected="${param.status == status}"></option>
									</th:block>
								</select>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="mb-12">
							<div class="form-group">
								<label for="description" class="form-label">Description <span
										class="text-danger">*</span></label>
								<textarea class="form-control" th:field="*{description}" id="description" rows="3"
									placeholder="Provide detailed description of the accident..." required></textarea>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6">
							<div class="form-group">
								<label for="affectedPersonName" class="form-label">Affected Person Name</label>
								<div style="position: relative;">
									<input type="text" class="form-control" id="affectedPersonName" name="affectedPersonName"
									placeholder="Search employee by name or ID" autocomplete="off" />
									<div id="affectedPersonDropdown" class="dropdown-menu"
										style="position: absolute; left: 0; right: 0; width: 100%; top: calc(100% + 0.125rem); display: none; max-height: 200px; overflow-y: auto; min-width: unset; padding: 0.5rem 0; border-radius: var(--bs-border-radius); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);">
									</div>

								</div>
								<input type="hidden" th:field="*{affectedPersonEmployeeId}" id="affectedPersonHidden" />
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-group">
								<label for="affectedPersonPosition" class="form-label">Position</label>
								<input type="text" class="form-control" th:field="*{affectedPersonPosition}" id="affectedPersonPosition"
									placeholder="e.g., Production Operator">
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6">
							<div class="form-group">
								<label for="witnessName" class="form-label">Witnesses</label>
								<div style="position: relative;">
									<input type="text" class="form-control" id="witnessName" name="witnesses"
									placeholder="Search employee by name or ID" autocomplete="off" />
									<div id="witnessDropdown" class="dropdown-menu"
										style="position: absolute; left: 0; right: 0; width: 100%; top: calc(100% + 0.125rem); display: none; max-height: 200px; overflow-y: auto; min-width: unset; padding: 0.5rem 0; border-radius: var(--bs-border-radius); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);">
									</div>
								</div>

							</div>
								<input type="hidden" th:field="*{witnesses}" id="witnessHidden" />
						</div>
						<div class="col-md-6">
							<div class="form-group">
								<label for="injuryType" class="form-label">Injury Type</label>
								<input type="text" class="form-control" th:field="*{injuryType}" id="injuryType"
									placeholder="e.g., Laceration">
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-12">
							<div class="form-group">
								<label for="causeOfAccident" class="form-label">Cause of Accident</label>
								<textarea class="form-control" th:field="*{causeOfAccident}" id="causeOfAccident" rows="2"
									placeholder="Describe the cause of the accident..."></textarea>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6">
							<div class="form-group">
								<label for="accidentImage">Image</label>
								<div class="mb-2">
									<img id="addImagePreview" src="" alt="Image Preview" class="img-thumbnail"
										style="max-height: 150px; display: none;">
								</div>
								<div class="custom-file">
									<input type="file" class="custom-file-input" id="accidentImage"
										name="accidentImageFile" accept="image/*">
									<label class="custom-file-label" for="accidentImage">Upload Images</label>
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-check mb-3">
									<input class="form-check-input" type="checkbox" th:field="*{medicalAttentionRequired}" id="medicalAttention"
										name="medicalAttentionRequired" value="true">
								<label class="form-check-label" for="medicalAttention">
									Medical Attention Required
								</label>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div class="modal-footer border-0 pt-2 pb-4 px-4 d-flex justify-content-between">
				<small class="text-muted">
					<i class="fas fa-asterisk text-danger mr-1"></i> Required fields
				</small>
				<div>
					<button type="button" class="btn btn-danger btn-border" data-bs-dismiss="modal">Cancel</button>
					<button type="submit" form="addAccidentForm" class="btn btn-primary ml-2">
						<i class="fa fa-save me-2"></i> Report Accident
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
