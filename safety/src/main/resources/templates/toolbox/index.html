<!-- TODO: wire up sortBy/asc when backend is ready -->

									<option value="50">50</option>
									<option value="100">100</option>

						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover table-responsive table-head-bg-info">
									<thead>
										<tr>
											<th>Code</th>
											<th>Location</th>
											<th>Date</th>
											<th>Time Started</th>
											<th>Time End</th>
											<th>Supervisor</th>
											<th>Status</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="meeting : ${toolboxPage.content}" class="clickable-row"
											th:data-toolbox-code="${meeting.code}" style="cursor: pointer;"
											onmouseover="this.style.backgroundColor='#f5f5f5';"
											onmouseout="this.style.backgroundColor='';">
											<td><strong th:text="${meeting.code}"></strong></td>
											<td th:text="${meeting.location}"></td>
											<td th:text="${meeting.meetingDate != null ? #temporals.format(meeting.meetingDate, 'yyyy-MM-dd') : ''}"></td>
											<td th:text="${meeting.timeStarted != null ? #temporals.format(meeting.timeStarted, 'HH:mm') : ''}"></td>
											<td th:text="${meeting.timeEnd != null ? #temporals.format(meeting.timeEnd, 'HH:mm') : '-'}"></td>
											<td th:with="supName=${meeting.supervisor ?: supervisorNameMap[meeting.supervisorEmployeeId]}"
												th:text="${supName ?: '-'}"></td>
											<td>
												<span class="badge" th:classappend="${
													meeting.status?.name() == 'COMPLETED' ? 'bg-success' :
													meeting.status?.name() == 'CANCELLED' ? 'bg-danger' :
													'bg-warning text-dark'
												}" th:text="${meeting.status?.getDisplayName()}"></span>
											</td>
										</tr>
										<tr th:if="${toolboxPage.content.isEmpty()}">
											<td colspan="7" class="text-center text-muted py-4">
												<i class="fa fa-inbox fa-2x mb-2 d-block"></i>
												No toolbox meetings recorded yet.
											</td>
										</tr>
									</tbody>
								</table>

			<!-- Pagination -->
			<div class="row mt-4">
				<div class="col-md-12">
					<nav aria-label="Page navigation">
						<ul class="pagination justify-content-center mb-0">
							<li class="page-item" th:classappend="${!toolboxPage.hasPrevious} ? 'disabled'">
								<a class="page-link"
									th:href="@{/training/toolbox(page=${toolboxPage.number - 1}, size=${pageSize})}"
									th:if="${toolboxPage.hasPrevious}">Previous</a>
								<span class="page-link" th:if="${!toolboxPage.hasPrevious}">Previous</span>
							</li>
							<li class="page-item active">
								<span class="page-link" th:text="${toolboxPage.number + 1}">1</span>
							</li>
							<li class="page-item">
								<span class="page-link text-muted">of <span
										th:text="${toolboxPage.totalPages}">1</span></span>
							</li>
							<li class="page-item" th:classappend="${!toolboxPage.hasNext} ? 'disabled'">
								<a class="page-link"
									th:href="@{/training/toolbox(page=${toolboxPage.number + 1}, size=${pageSize})}"
									th:if="${toolboxPage.hasNext}">Next</a>
								<span class="page-link" th:if="${!toolboxPage.hasNext}">Next</span>
							</li>
						</ul>
					</nav>
				</div>
			</div>

	<th:block layout:fragment="scripts">
		<script th:src="@{/assets/js/custom/toolbox-modal.js}"></script>
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const clickableRows = document.querySelectorAll('.clickable-row');
				clickableRows.forEach(row => {
					row.addEventListener('click', function (e) {
						if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
						const code = this.getAttribute('data-toolbox-code');
						if (code) window.location.href = '/training/toolbox/' + code;
					});
				});

				// Page size
				const pageSizeSelect = document.getElementById('pageSizeSelect');
				if (pageSizeSelect) {
					pageSizeSelect.addEventListener('change', function () {
						const url = new URL(window.location.href);
						url.searchParams.set('size', this.value);
						url.searchParams.set('page', '0');
						window.location.href = url.toString();
					});
				}

				// Apply filters
				document.getElementById('applyFilters')?.addEventListener('click', function () {
					const params = new URLSearchParams();
					params.set('page', '0');
					const size = pageSizeSelect?.value;
					if (size) params.set('size', size);
					const keyword = document.querySelector('[name="keyword"]')?.value?.trim();
					if (keyword) params.set('keyword', keyword);
					const dateFrom = document.querySelector('[name="toolboxMeetingDateFrom"]')?.value;
					if (dateFrom) params.set('toolboxMeetingDateFrom', dateFrom);
					const dateTo = document.querySelector('[name="toolboxMeetingDateTo"]')?.value;
					if (dateTo) params.set('toolboxMeetingDateTo', dateTo);
					const reporterEmpId = document.getElementById('filterReporterHidden')?.value;
					if (reporterEmpId) params.set('reporterEmpId', reporterEmpId);
					window.location.href = '/training/toolbox?' + params.toString();
				});

				// Reset filters
				document.getElementById('resetFilters')?.addEventListener('click', function () {
					window.location.href = '/training/toolbox';
				});
			});
		</script>
	</th:block>
