<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/dashboard}">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Certification Detail</title>
	<meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
	<link rel="icon" href="/assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

	<!-- Fonts and icons -->
	<script src="/assets/js/plugin/webfont/webfont.min.js"></script>
	<script>
		WebFont.load({
			google: { "families": ["Public Sans:300,400,500,600,700"] },
			custom: { "families": ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"], urls: ['/assets/css/fonts.min.css'] },
			active: function () {
				sessionStorage.fonts = true;
			}
		});
	</script>

	<!-- CSS Files -->
	<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/plugins.min.css">
	<link rel="stylesheet" href="/assets/css/kaiadmin.min.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-inner">
			<!-- Header Section -->
			<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
				<div>
					<a href="/training/hse-certification" class="btn btn-secondary btn-sm mb-3">
						<i class="fa fa-arrow-left me-2"></i> Back to List
					</a>
					<h2 class="fw-bold mb-2 text-dark" th:text="'Certification: ' + ${certification.code}">Certification Detail</h2>
					<p class="mb-0">
						<span th:class="${certification.statusBadgeClass}" th:text="${certification.status}"></span>
					</p>
				</div>
				<div class="ms-md-auto py-2 py-md-0">
					<button type="button" class="btn btn-danger btn-round" id="deleteCertificationBtn"
						sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" th:data-certification-code="${certification.code}"
						onclick="deleteCertification(event)">
						<i class="fa fa-trash me-2"></i> Delete
					</button>
				</div>
			</div>

			<div class="row">
				<!-- Main Details Column -->
				<div class="col-md-8">
					<div class="card mb-4 shadow-sm border-0">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Certification Information</div>
						</div>
						<div class="card-body">
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Code</label>
										<p class="text-muted" th:text="${certification.code}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Certificate Name</label>
										<p class="text-muted" th:text="${certification.certificateName}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Employee ID</label>
										<p class="text-muted" th:text="${certification.employeeId}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Employee Name</label>
										<p class="text-muted" th:text="${certification.employeeName ?: 'N/A'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Certificate No.</label>
										<p class="text-muted" th:text="${certification.certificateNumber ?: 'N/A'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Issuing Body</label>
										<p class="text-muted" th:text="${certification.issuingBody ?: 'N/A'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Issued Date</label>
										<p class="text-muted"
											th:text="${certification.issuedDate != null ? #temporals.format(certification.issuedDate, 'dd MMMM, yyyy') : 'N/A'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Expiry Date</label>
										<p class="text-muted"
											th:text="${certification.expiryDate != null ? #temporals.format(certification.expiryDate, 'dd MMMM, yyyy') : 'No expiry'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-12">
									<div class="form-group">
										<label class="form-label fw-bold">Remarks</label>
										<p class="text-muted" th:text="${certification.remarks ?: 'N/A'}"></p>
									</div>
								</div>
							</div>
							<div class="row mb-4">
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Created By</label>
										<p class="text-muted" th:text="${certification.createdBy != null ? certification.createdBy.username : 'Unknown'}"></p>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label class="form-label fw-bold">Created At</label>
										<p class="text-muted"
											th:text="${certification.createdAt != null ? #temporals.format(certification.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></p>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Sidebar Column -->
				<div class="col-md-4">
					<!-- Summary Card -->
					<div class="card mb-4 shadow-sm border-0">
						<div class="card-header bg-gradient bg-primary text-white border-0">
							<div class="card-title text-white mb-0">Summary</div>
						</div>
						<div class="card-body">
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Employee</p>
									<p class="fw-bold mb-0" th:text="${certification.employeeName ?: certification.employeeId}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Certificate</p>
									<p class="fw-bold mb-0" th:text="${certification.certificateName}"></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Status</p>
									<p class="mb-0"><span th:class="${certification.statusBadgeClass}" th:text="${certification.status}"></span></p>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-12">
									<p class="text-muted small mb-1">Expiry Date</p>
									<p class="fw-bold mb-0"
										th:text="${certification.expiryDate != null ? #temporals.format(certification.expiryDate, 'dd/MM/yyyy') : 'No expiry'}"></p>
								</div>
							</div>
							<hr>
							<div class="row">
								<div class="col-12">
									<p class="text-muted small mb-1">Last Updated</p>
									<p class="fw-bold mb-0"
										th:text="${certification.updatedAt != null ? #temporals.format(certification.updatedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></p>
								</div>
							</div>
						</div>
					</div>

					<!-- File Card -->
					<div class="card shadow-sm border-0 mb-4" th:if="${certification.filePath != null}">
						<div class="card-header bg-gradient bg-success text-white border-0">
							<div class="card-title text-white mb-0">
								<i class="fa fa-file me-2"></i> Attached File
							</div>
						</div>
						<div class="card-body p-3">
							<div class="d-flex align-items-center mb-3">
								<i th:class="${certification.getFileIconClass()}" style="font-size: 1.5rem;"></i>
								<div class="ms-3 flex-grow-1">
									<p class="mb-1 fw-bold text-truncate" th:title="${certification.originalFileName}" th:text="${certification.originalFileName}"></p>
									<small class="text-muted" th:text="${certification.getFormattedFileSize()}"></small>
								</div>
							</div>
							<div class="d-flex gap-2">
								<a th:href="@{'/file/download/' + ${certification.filePath}}"
									class="btn btn-sm btn-outline-primary flex-grow-1">
									<i class="fa fa-download me-1"></i> Download
								</a>
								<a th:href="@{'/file/' + ${certification.filePath}}" target="_blank"
									class="btn btn-sm btn-outline-info flex-grow-1">
									<i class="fa fa-external-link-alt me-1"></i> Open
								</a>
							</div>
						</div>
					</div>

					<!-- No File Message -->
					<div class="card shadow-sm border-0 mb-4" th:if="${certification.filePath == null}">
						<div class="card-body text-center p-4">
							<i class="fa fa-file fa-2x text-muted mb-3 d-block"></i>
							<p class="text-muted mb-0">No file attached</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			function deleteCertification(event) {
				event.preventDefault();
				if (!confirm('Are you sure you want to delete this certification record? This action cannot be undone.')) {
					return;
				}

				const code = document.getElementById('deleteCertificationBtn').getAttribute('data-certification-code');

				fetch('/api/hse-certification/' + code, {
					method: 'DELETE',
					headers: {
						'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.getAttribute('content')
					}
				})
				.then(response => {
					if (response.ok) {
						alert('Certification record deleted successfully');
						window.location.href = '/training/hse-certification';
					} else {
						alert('Error deleting record');
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('Error deleting record');
				});
			}
		</script>
	</th:block>

</body>

</html>
